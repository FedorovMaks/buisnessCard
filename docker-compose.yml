services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: digital_card
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d digital_card']
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://card:card@db:5432/digital_card
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
